<!-- Google Analytics , Google Ads -->
<!-- Google tag (gtag.js) for GA4 + Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Configure GA4 with manual SPA page view tracking
    gtag('config', 'G-XXXXXXXXXX', {
      send_page_view: false,
      cookie_flags: 'max-age=7200;secure;samesite=none',
      linker: {
        domains: ['techbytesstore.myshopify.com', 'checkout.digitex.com'] // Links session to Shopify Checkout
      }
    });

    // Configure Google Ads Conversion Tag
    gtag('config', 'AW-YYYYYYYYY');
  </script>
